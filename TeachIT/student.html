<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Дневник ученика</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script>
(function() {
    var p1 = "AIzaSyD3bGyy6w2NyH4PVUKTDE27ZC1NK_7eEQO";
    var d1 = "https://bpla-game";
    var d2 = "-default-rtdb.firebaseio.com";
    window.FIREBASE_CONFIG = {
        apiKey: p1,
        authDomain: "bpla-game.firebaseapp.com",
        databaseURL: d1 + d2,
        projectId: "bpla-game",
        storageBucket: "bpla-game.firebasestorage.app",
        messagingSenderId: "352416331895",
        appId: "1:352416331895:web:335f54db495c9be60bae72"
    };
})();
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
    getDatabase, ref, set, get, update, onValue, remove, push
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const app = initializeApp(window.FIREBASE_CONFIG);
const db = getDatabase(app);
window.fb = { db, ref: (p) => ref(db, p), set, get, update, onValue, remove, push };
window.fbReady = true;
console.log('✅ Firebase готов');
</script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; font-family: 'Inter', sans-serif; }

    body {
        background: linear-gradient(135deg, #0a1a3a 0%, #1a2a5a 50%, #0a1a3a 100%);
        color: #fff;
        padding: 20px;
        min-height: 100vh;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 20% 20%, rgba(68, 255, 136, 0.12) 0%, transparent 40%),
            radial-gradient(circle at 80% 80%, rgba(74, 158, 255, 0.12) 0%, transparent 40%);
        pointer-events: none;
        z-index: -1;
    }

    .wrap { max-width: 1000px; margin: 0 auto; }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.4s; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Авторизация */
    .auth-box {
        max-width: 480px;
        margin: 60px auto;
        background: rgba(15, 15, 26, 0.85);
        backdrop-filter: blur(20px);
        border: 2px solid rgba(68, 255, 136, 0.3);
        border-radius: 24px;
        padding: 44px 40px;
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.7);
    }
    .auth-logo {
        font-size: 72px;
        text-align: center;
        margin-bottom: 12px;
        filter: drop-shadow(0 0 30px #44ff88);
        animation: logoFloat 3s ease-in-out infinite;
    }
    @keyframes logoFloat {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
    }
    .auth-title {
        text-align: center;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 3px;
        background: linear-gradient(135deg, #44ff88 0%, #4a9eff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 6px;
    }
    .auth-subtitle {
        text-align: center;
        color: #8899bb;
        font-size: 12px;
        letter-spacing: 3px;
        margin-bottom: 30px;
        font-weight: 700;
    }

    .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 24px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 12px;
        padding: 4px;
    }
    .tab {
        flex: 1;
        padding: 12px;
        background: none;
        border: none;
        color: #8899bb;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 2px;
        cursor: pointer;
        font-family: inherit;
        border-radius: 8px;
        transition: 0.3s;
        text-transform: uppercase;
    }
    .tab.active {
        background: linear-gradient(135deg, #44ff88, #22aa44);
        color: #0a0a14;
    }

    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label {
        display: block;
        color: #8899bb;
        font-size: 11px;
        letter-spacing: 2px;
        margin-bottom: 8px;
        font-weight: 800;
        text-transform: uppercase;
    }
    .form-group input {
        width: 100%;
        padding: 14px 18px;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #2a3a5a;
        border-radius: 12px;
        color: #fff;
        font-size: 15px;
        font-family: inherit;
        font-weight: 600;
        outline: none;
        transition: 0.3s;
    }
    .form-group input:focus {
        border-color: #44ff88;
        box-shadow: 0 0 0 4px rgba(68, 255, 136, 0.15);
    }
    .form-group input::placeholder { color: #4a5a7a; }

    .btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #44ff88, #22aa44);
        border: none;
        border-radius: 12px;
        color: #0a0a14;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 3px;
        cursor: pointer;
        font-family: inherit;
        transition: 0.3s;
        text-transform: uppercase;
        box-shadow: 0 8px 30px rgba(68, 255, 136, 0.4);
        margin-top: 8px;
    }
    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 50px rgba(68, 255, 136, 0.7);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid #2a3a5a;
        color: #8899bb;
        box-shadow: none;
    }
    .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #44ff88;
        color: #fff;
        box-shadow: none;
        transform: none;
    }

    /* Шапка */
    .header {
        background: rgba(15, 15, 26, 0.85);
        backdrop-filter: blur(20px);
        border: 2px solid rgba(68, 255, 136, 0.3);
        border-radius: 20px;
        padding: 20px 28px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
    }
    .header .user-info {
        display: flex;
        align-items: center;
        gap: 16px;
    }
    .header .avatar {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #44ff88, #4a9eff);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 900;
        color: #0a0a14;
    }
    .header .user-name { font-size: 18px; font-weight: 900; }
    .header .user-role {
        color: #8899bb;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-top: 2px;
    }

    /* Карточки */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
    }
    .card {
        background: rgba(15, 15, 26, 0.85);
        border: 2px solid #2a3a5a;
        border-radius: 20px;
        padding: 24px;
        transition: 0.3s;
    }
    .card:hover { border-color: #44ff88; }
    .card-label {
        color: #8899bb;
        font-size: 11px;
        letter-spacing: 2px;
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 8px;
    }
    .card-value {
        font-size: 44px;
        font-weight: 900;
        background: linear-gradient(135deg, #44ff88 0%, #4a9eff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
    }
    .card-value.small { font-size: 30px; }
    .card-value.bad {
        background: linear-gradient(135deg, #ff4a7d 0%, #cc2a5a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* Вкладки */
    .nav-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .nav-tab {
        padding: 12px 22px;
        background: rgba(15, 15, 26, 0.85);
        border: 2px solid #2a3a5a;
        border-radius: 12px;
        color: #8899bb;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1px;
        cursor: pointer;
        font-family: inherit;
        transition: 0.2s;
    }
    .nav-tab:hover { border-color: #44ff88; color: #fff; }
    .nav-tab.active {
        background: linear-gradient(135deg, #44ff88, #22aa44);
        border-color: transparent;
        color: #0a0a14;
        box-shadow: 0 6px 20px rgba(68, 255, 136, 0.4);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s; }

    /* Задания */
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .task {
        background: rgba(15, 15, 26, 0.85);
        border: 2px solid #2a3a5a;
        border-radius: 16px;
        padding: 18px 22px;
        display: flex;
        align-items: flex-start;
        gap: 16px;
        transition: 0.3s;
    }
    .task:hover { border-color: #44ff88; }
    .task.done { opacity: 0.55; border-color: #22aa44; }
    .task.done .task-text { text-decoration: line-through; }

    .task-check {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 2px solid #4a9eff;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: 0.2s;
        font-size: 16px;
        color: transparent;
    }
    .task-check:hover { transform: scale(1.1); }
    .task.done .task-check {
        background: linear-gradient(135deg, #44ff88, #22aa44);
        border-color: #44ff88;
        color: #0a0a14;
    }

    .task-content { flex: 1; }
    .task-subject {
        color: #44ff88;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
    }
    .task-text {
        color: #e8e8f5;
        font-size: 15px;
        line-height: 1.5;
        font-weight: 500;
        white-space: pre-wrap;
    }
    .task-meta {
        color: #667788;
        font-size: 12px;
        margin-top: 6px;
        font-weight: 600;
    }

    /* Оценки */
    .grades-list { display: flex; flex-direction: column; gap: 10px; }
    .grade-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 18px;
        background: rgba(15, 15, 26, 0.85);
        border: 2px solid #2a3a5a;
        border-radius: 14px;
        transition: 0.2s;
    }
    .grade-row:hover { border-color: #44ff88; }
    .grade-value {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 900;
        flex-shrink: 0;
    }
    .grade-value.g5 {
        background: linear-gradient(135deg, #44ff88, #22aa44);
        color: #0a0a14;
        box-shadow: 0 0 25px rgba(68, 255, 136, 0.6);
    }
    .grade-value.g4 {
        background: linear-gradient(135deg, #4a9eff, #2a6acc);
        color: #fff;
        box-shadow: 0 0 25px rgba(74, 158, 255, 0.6);
    }
    .grade-value.g3 {
        background: linear-gradient(135deg, #ffdd44, #cc9900);
        color: #0a0a14;
        box-shadow: 0 0 25px rgba(255, 221, 68, 0.6);
    }
    .grade-value.g2 {
        background: linear-gradient(135deg, #ff4a7d, #cc2a5a);
        color: #fff;
        box-shadow: 0 0 25px rgba(255, 74, 125, 0.6);
    }
    .grade-info { flex: 1; }
    .grade-subject { color: #fff; font-size: 15px; font-weight: 800; }
    .grade-comment { color: #8899bb; font-size: 13px; margin-top: 4px; font-weight: 500; }
    .grade-date {
        color: #556677;
        font-size: 12px;
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
    }

    .empty {
        text-align: center;
        color: #556677;
        padding: 50px 20px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.7;
    }
    .empty .icon {
        font-size: 56px;
        display: block;
        margin-bottom: 14px;
        opacity: 0.5;
    }

    /* Toast */
    #toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(150px);
        padding: 14px 26px;
        background: rgba(15, 15, 26, 0.98);
        border: 2px solid #44ff88;
        border-radius: 14px;
        color: #44ff88;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1px;
        z-index: 9999;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
        max-width: 90vw;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(68, 255, 136, 0.5);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: #ff4a7d; color: #ff4a7d; }
    #toast.warn { border-color: #ffdd44; color: #ffdd44; }

    @media (max-width: 600px) {
        .auth-box { padding: 32px 24px; margin: 30px auto; }
        .auth-logo { font-size: 60px; }
        .auth-title { font-size: 22px; letter-spacing: 2px; }
        .card-value { font-size: 34px; }
        .header { padding: 16px 20px; }
    }
</style>
</head>
<body>

<div id="toast"></div>

<div class="wrap">

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div class="screen active" id="screenAuth">
        <div class="auth-box">
            <div class="auth-logo">📚</div>
            <div class="auth-title">ДНЕВНИК</div>
            <div class="auth-subtitle">УЧЕНИК</div>

            <div class="tabs">
                <button class="tab active" id="tabLogin">ВОЙТИ</button>
                <button class="tab" id="tabRegister">РЕГИСТРАЦИЯ</button>
            </div>

            <div id="loginForm">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="loginNick" placeholder="Введи логин" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введи пароль">
                </div>
                <button class="btn" id="loginBtn">ВОЙТИ</button>
            </div>

            <div id="registerForm" style="display:none;">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="regNick" placeholder="Придумай логин" maxlength="20" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Полное имя</label>
                    <input type="text" id="regName" placeholder="Иванов Иван" maxlength="50" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Класс</label>
                    <input type="text" id="regGrade" placeholder="8А" maxlength="5" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPassword" placeholder="Придумай пароль" maxlength="50">
                </div>
                <button class="btn" id="registerBtn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
            </div>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div class="screen" id="screenMain">

        <div class="header">
            <div class="user-info">
                <div class="avatar" id="headerAvatar">?</div>
                <div>
                    <div class="user-name" id="headerName">—</div>
                    <div class="user-role" id="headerRole">—</div>
                </div>
            </div>
            <button class="btn btn-ghost" style="width:auto;margin:0;padding:12px 24px;" id="logoutBtn">ВЫЙТИ</button>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-label">Средний балл</div>
                <div class="card-value" id="myAvg">—</div>
            </div>
            <div class="card">
                <div class="card-label">Оценок</div>
                <div class="card-value small" id="myGradesCount">0</div>
            </div>
            <div class="card">
                <div class="card-label">Заданий</div>
                <div class="card-value small" id="myTasksCount">0</div>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="tasks">📝 Задания</button>
            <button class="nav-tab" data-tab="grades">📊 Мои оценки</button>
        </div>

        <div class="tab-content active" id="tabTasks">
            <div class="task-list" id="tasksList"></div>
        </div>

        <div class="tab-content" id="tabGrades">
            <div class="grades-list" id="gradesList"></div>
        </div>

    </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
let currentUser = null;
let gradesListener = null;
let homeworkListener = null;
let doneListener = null;
let myGrades = {};
let myDone = {};
let myHomework = [];

// ============ TOAST ============
function toast(text, type = 'ok') {
    const el = $('toast');
    el.textContent = text;
    el.className = 'show' + (type === 'error' ? ' error' : (type === 'warn' ? ' warn' : ''));
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
}

// ============ ВКЛАДКИ АВТОРИЗАЦИИ ============
$('tabLogin').addEventListener('click', () => {
    $('tabLogin').classList.add('active');
    $('tabRegister').classList.remove('active');
    $('loginForm').style.display = 'block';
    $('registerForm').style.display = 'none';
});

$('tabRegister').addEventListener('click', () => {
    $('tabRegister').classList.add('active');
    $('tabLogin').classList.remove('active');
    $('loginForm').style.display = 'none';
    $('registerForm').style.display = 'block';
});

// ============ РЕГИСТРАЦИЯ ============
$('registerBtn').addEventListener('click', async () => {
    const nick = $('regNick').value.trim().toLowerCase().replace(/[.#$\[\]/]/g, '_');
    const name = $('regName').value.trim();
    const grade = $('regGrade').value.trim().toUpperCase();
    const password = $('regPassword').value;

    if (!nick || nick.length < 2) return toast('Логин минимум 2 символа', 'error');
    if (!name || name.length < 3) return toast('Введи полное имя', 'error');
    if (!grade || grade.length < 2) return toast('Введи класс (например 8А)', 'error');
    if (!password || password.length < 3) return toast('Пароль минимум 3 символа', 'error');

    try {
        const userRef = fb.ref('school/users/' + nick);
        const snap = await fb.get(userRef);
        if (snap.exists()) return toast('Логин занят', 'error');

        await fb.set(userRef, {
            nickname: nick,
            fullName: name,
            grade: grade,
            password: password,
            role: 'student',
            createdAt: Date.now()
        });

        toast('✅ Регистрация успешна!');
        enterApp(nick);
    } catch (e) {
        console.error(e);
        toast('Ошибка: ' + (e.message || e), 'error');
    }
});

// ============ ВХОД ============
$('loginBtn').addEventListener('click', async () => {
    const nick = $('loginNick').value.trim().toLowerCase().replace(/[.#$\[\]/]/g, '_');
    const password = $('loginPassword').value;

    if (!nick || !password) return toast('Введи логин и пароль', 'error');

    try {
        const snap = await fb.get(fb.ref('school/users/' + nick));
        if (!snap.exists()) return toast('Пользователь не найден', 'error');

        const data = snap.val();
        if (data.password !== password) return toast('Неверный пароль', 'error');
        if (data.role === 'teacher') return toast('Это сайт для учеников', 'warn');

        toast('✅ Привет, ' + data.fullName + '!');
        enterApp(nick);
    } catch (e) {
        console.error(e);
        toast('Ошибка: ' + (e.message || e), 'error');
    }
});

$('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('regPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') $('registerBtn').click(); });

// ============ ВХОД В ПРИЛОЖЕНИЕ ============
async function enterApp(nick) {
    const snap = await fb.get(fb.ref('school/users/' + nick));
    const data = snap.val();

    currentUser = { nickname: nick, fullName: data.fullName, grade: data.grade };
    localStorage.setItem('school_student', JSON.stringify(currentUser));

    showScreen('screenMain');
    $('headerName').textContent = data.fullName;
    $('headerRole').textContent = 'Ученик • ' + data.grade;
    $('headerAvatar').textContent = data.fullName.charAt(0).toUpperCase();

    subscribeGrades();
    subscribeHomework();
    subscribeDone();
}

$('logoutBtn').addEventListener('click', () => {
    if (gradesListener) gradesListener();
    if (homeworkListener) homeworkListener();
    if (doneListener) doneListener();
    localStorage.removeItem('school_student');
    location.reload();
});

// ============ ВКЛАДКИ КОНТЕНТА ============
document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const name = tab.dataset.tab;
        $('tab' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
    });
});

// ============ ОЦЕНКИ ============
function subscribeGrades() {
    if (gradesListener) gradesListener();
    gradesListener = fb.onValue(fb.ref('school/grades/' + currentUser.nickname), (snap) => {
        myGrades = snap.val() || {};
        renderGrades();
        updateStats();
    });
}

function renderGrades() {
    const list = $('gradesList');
    const grades = Object.entries(myGrades)
        .map(([id, g]) => ({ ...g, id }))
        .sort((a, b) => (b.date || 0) - (a.date || 0));

    if (grades.length === 0) {
        list.innerHTML = '<div class="empty"><span class="icon">📊</span>Пока нет оценок.</div>';
        return;
    }

    list.innerHTML = '';
    grades.forEach(g => {
        const row = document.createElement('div');
        row.className = 'grade-row';
        const date = g.date ? new Date(g.date).toLocaleDateString('ru-RU', {
            day: 'numeric', month: 'short', year: 'numeric'
        }) : '';
        row.innerHTML = `
            <div class="grade-value g${g.value}">${g.value}</div>
            <div class="grade-info">
                <div class="grade-subject">${escapeHtml(g.subject || 'Без предмета')}</div>
                ${g.comment ? `<div class="grade-comment">${escapeHtml(g.comment)}</div>` : ''}
                ${g.teacher ? `<div class="grade-comment">👨‍🏫 ${escapeHtml(g.teacher)}</div>` : ''}
            </div>
            <div class="grade-date">${date}</div>
        `;
        list.appendChild(row);
    });
}

// ============ ДОМАШКА ============
function subscribeHomework() {
    if (homeworkListener) homeworkListener();
    homeworkListener = fb.onValue(fb.ref('school/homework'), (snap) => {
        const data = snap.val() || {};
        myHomework = Object.entries(data)
            .map(([id, h]) => ({ ...h, id }))
            .filter(h => h.grade === currentUser.grade)
            .sort((a, b) => (b.date || 0) - (a.date || 0));
        renderTasks();
        updateStats();
    });
}

function subscribeDone() {
    if (doneListener) doneListener();
    doneListener = fb.onValue(fb.ref('school/done/' + currentUser.nickname), (snap) => {
        myDone = snap.val() || {};
        renderTasks();
    });
}

function renderTasks() {
    const list = $('tasksList');
    if (myHomework.length === 0) {
        list.innerHTML = '<div class="empty"><span class="icon">📝</span>Пока нет заданий.</div>';
        return;
    }

    list.innerHTML = '';
    myHomework.forEach(hw => {
        const isDone = !!myDone[hw.id];
        const task = document.createElement('div');
        task.className = 'task' + (isDone ? ' done' : '');

        const date = hw.date ? new Date(hw.date).toLocaleDateString('ru-RU', {
            day: 'numeric', month: 'short'
        }) : '';

        task.innerHTML = `
            <div class="task-check">✓</div>
            <div class="task-content">
                <div class="task-subject">${escapeHtml(hw.subject || '')}</div>
                <div class="task-text">${escapeHtml(hw.task || '')}</div>
                <div class="task-meta">${date}${hw.teacher ? ' • ' + escapeHtml(hw.teacher) : ''}</div>
            </div>
        `;

        task.querySelector('.task-check').addEventListener('click', async () => {
            try {
                const doneRef = fb.ref('school/done/' + currentUser.nickname + '/' + hw.id);
                if (isDone) {
                    await fb.remove(doneRef);
                    toast('Отмечено как не сделано');
                } else {
                    await fb.set(doneRef, true);
                    toast('✅ Отмечено как сделано!');
                }
            } catch (e) {
                toast('Ошибка: ' + (e.message || e), 'error');
            }
        });

        list.appendChild(task);
    });
}

// ============ СТАТИСТИКА ============
function updateStats() {
    const grades = Object.values(myGrades);
    $('myGradesCount').textContent = grades.length;

    if (grades.length === 0) {
        $('myAvg').textContent = '—';
        $('myAvg').classList.remove('bad');
    } else {
        const sum = grades.reduce((acc, g) => acc + (parseFloat(g.value) || 0), 0);
        const avg = sum / grades.length;
        $('myAvg').textContent = avg.toFixed(2);
        $('myAvg').classList.toggle('bad', avg < 3.5);
    }

    $('myTasksCount').textContent = myHomework.length;
}

// ============ УТИЛИТЫ ============
function escapeHtml(str) {
    return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ============ АВТОВХОД ============
(async function init() {
    try {
        const saved = localStorage.getItem('school_student');
        if (saved) {
            const user = JSON.parse(saved);
            if (user && user.nickname) {
                $('loginNick').value = user.nickname;
                const snap = await fb.get(fb.ref('school/users/' + user.nickname));
                if (snap.exists() && snap.val().role === 'student') {
                    // Ник подставляем, пароль пользователь вводит сам
                } else {
                    localStorage.removeItem('school_student');
                }
            }
        }
    } catch (e) {}

    showScreen('screenAuth');
})();

console.log('✅ Дневник ученика готов');
</script>
