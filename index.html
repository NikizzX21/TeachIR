            <div style="font-size:14px; color:#1a1a1a; margin-bottom:10px; white-space:pre-wrap;">${escapeHtml(q.text)}</div>`;

        if (q.files && q.files.length) {
            html += `<div style="margin-bottom:10px;" data-check-files="${i}">${renderFilesForView(q.files, 'cq' + i)}</div>`;
        }

        if (q.type === 'choice') {
            const correctText = (q.answers.find(a => a.correct) || {}).text || '';
            html += `<div style="font-size:13px; color:#4a5568;">Ответ ученика: <b style="color:#1a1a1a; white-space:pre-wrap;">${escapeHtml(ans && ans.text || '(нет)')}</b></div>
                <div style="font-size:13px; color:#4a5568; margin-top:4px;">Правильный: <b style="color:#2e7d32; white-space:pre-wrap;">${escapeHtml(correctText)}</b></div>`;
        } else {
            html += `<div style="font-size:13px; color:#4a5568;">Ответ ученика:</div>
                <div style="background:#fafbfc; padding:12px; border-radius:8px; margin-top:6px; border:1px solid #e0e4ea; font-size:14px; white-space:pre-wrap; word-break:break-word;">${escapeHtml(ans && ans.text || '(нет ответа)')}</div>`;

            if (qCheckMode === 'manual') {
                const cur = manualResults[i];
                html += `<div class="manual-check" data-qindex="${i}">
                    <span class="lbl">Оценка ответа:</span>
                    <button class="check-btn check-yes ${cur === true ? 'active' : ''}" data-cq="${i}" data-cv="true">✓</button>
                    <button class="check-btn check-no ${cur === false ? 'active' : ''}" data-cq="${i}" data-cv="false">✕</button>
                    <span class="check-status ${cur === true ? 'ok' : cur === false ? 'fail' : ''}" data-sb="${i}" style="${cur === true || cur === false ? '' : 'background:#f0f2f5; color:#6b7280;'}">
                        ${cur === true ? 'Верно' : cur === false ? 'Неверно' : 'Ожидает'}
                    </span>
                </div>`;
            } else {
                html += `<div style="font-size:13px; color:#4a5568; margin-top:8px;">Правильный: <b style="color:#2e7d32; white-space:pre-wrap;">${escapeHtml(q.correctText)}</b></div>`;
            }
        }
        html += `</div>`;
    });

    html += `<div style="margin-top:24px; padding-top:20px; border-top:1px solid #e0e4ea;">
        <div class="grid-2">
            ${!isExam ? `<div>
                <label style="font-size:13px; font-weight:600; color:#374151; margin-bottom:10px; display:block;">Оценка</label>
                <div style="display:flex; gap:10px;">
                    <button class="btn grade grade-5" style="width:56px; height:56px; font-size:22px; padding:0;" data-g="5">5</button>
                    <button class="btn grade grade-4" style="width:56px; height:56px; font-size:22px; padding:0;" data-g="4">4</button>
                    <button class="btn grade grade-3" style="width:56px; height:56px; font-size:22px; padding:0;" data-g="3">3</button>
                    <button class="btn grade grade-2" style="width:56px; height:56px; font-size:22px; padding:0;" data-g="2">2</button>
                </div>
            </div>` : `<div>
                <label style="font-size:13px; font-weight:600; color:#374151; margin-bottom:10px; display:block;">Баллы ОГЭ/ЕГЭ (макс. ${task.maxScore})</label>
                <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                    <input type="number" id="examScoreInput" min="0" max="${task.maxScore}" value="${sub.score || 0}" style="width:100px; padding:12px; border:1px solid #d0d5dd; border-radius:8px; font-size:18px; font-weight:600; text-align:center; font-family:inherit;">
                    <span style="color:#6b7280;">из ${task.maxScore}</span>
                </div>
            </div>`}
            ${task.maxPoints ? `<div>
                <label style="font-size:13px; font-weight:600; color:#374151; margin-bottom:10px; display:block;">🪙 Баллов ученику (макс. ${task.maxPoints})</label>
                <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                    <input type="number" id="pointsInput" min="0" max="${task.maxPoints}" value="${sub.points || 0}" style="width:120px; padding:12px; border:2px solid #ffe0b2; border-radius:8px; font-size:18px; font-weight:600; text-align:center; font-family:inherit; color:#ef6c00; background:#fff8e1;">
                    <span style="color:#6b7280;">из ${task.maxPoints}</span>
                </div>
            </div>` : ''}
        </div>
        <button class="btn btn-primary btn-block" id="saveGradeBtn" style="margin-top:20px; padding:14px;">Сохранить</button>
    </div>`;

    content.innerHTML = html;

    task.questions.forEach((q, i) => {
        if (q.files && q.files.length) {
            const wrap = content.querySelector(`[data-check-files="${i}"]`);
            if (wrap) attachFileClickHandlers(wrap, q.files);
        }
    });

    content.querySelectorAll('[data-cq]').forEach(btn => {
        btn.addEventListener('click', () => {
            const qi = parseInt(btn.dataset.cq);
            const val = btn.dataset.cv === 'true';
            manualResults[qi] = val;
            const row = content.querySelector(`.manual-check[data-qindex="${qi}"]`);
            row.querySelectorAll('.check-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const badge = row.querySelector(`[data-sb="${qi}"]`);
            badge.className = 'check-status ' + (val ? 'ok' : 'fail');
            badge.style = '';
            badge.textContent = val ? 'Верно' : 'Неверно';
        });
    });

    let selectedGrade = null;
    content.querySelectorAll('[data-g]').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedGrade = parseInt(btn.dataset.g);
            content.querySelectorAll('[data-g]').forEach(b => b.style.outline = '');
            btn.style.outline = '3px solid #2196F3';
        });
    });

    $('saveGradeBtn').addEventListener('click', async () => {
        const updateData = { status: 'graded', gradedAt: Date.now() };
        if (Object.keys(manualResults).length > 0) updateData.manualChecks = manualResults;

        if (isExam) {
            updateData.score = parseInt($('examScoreInput').value) || 0;
            updateData.maxScore = task.maxScore;
        } else {
            if (!selectedGrade) return toast('Выберите оценку', 'error');
            updateData.grade = selectedGrade;
        }

        let pointsToAdd = 0;
        if (task.maxPoints) {
            const points = parseInt($('pointsInput').value) || 0;
            updateData.points = points;
            pointsToAdd = points;
        }

        try {
            await fb.update(fb.ref('teachlexa/submissions/' + sub.id), updateData);

            if (pointsToAdd > 0 && sub.studentKey && sub.studentKey !== 'teacher') {
                const userRef = fb.ref('teachlexa/users/' + sub.studentKey);
                const userSnap = await userRef.get();
                const userData = userSnap.val() || {};
                const oldBalance = userData.balance || 0;
                const newBalance = oldBalance + pointsToAdd;

                const historyRef = fb.push(fb.ref('teachlexa/users/' + sub.studentKey + '/pointsHistory'));
                await fb.set(historyRef, {
                    amount: pointsToAdd,
                    taskTitle: sub.taskTitle,
                    taskId: sub.taskId,
                    at: Date.now()
                });

                await fb.update(userRef, { balance: newBalance });
                toast('Оценка сохранена. Начислено ' + pointsToAdd + ' баллов');
            } else {
                toast('Оценка сохранена');
            }
            closeModal('checkModal');
        } catch (e) { console.error(e); toast('Ошибка: ' + (e.message || e), 'error'); }
    });

    openModal('checkModal');
}

/* ====== УЧИТЕЛЬ: УЧЕНИКИ ====== */
function renderStudents(users) {
    const list = $('studentsList');
    if (!list) return;
    const students = Object.entries(users)
        .map(([key, u]) => ({ ...u, key }))
        .filter(u => u.role === 'student')
        .sort((a,b) => a.name.localeCompare(b.name));

    if (students.length === 0) { list.innerHTML = '<div class="empty">Учеников пока нет</div>'; return; }

    list.innerHTML = '';
    students.forEach(st => {
        const invCount = Object.keys(st.inventory || {}).length;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-header">
                <div style="flex:1;">
                    <div class="card-title">${escapeHtml(st.name)}</div>
                    <div class="card-meta" style="margin-top:8px;">
                        <span>Пароль: <b style="color:#1a1a1a;">${escapeHtml(st.password)}</b></span>
                        <span>🪙 Баланс: <b style="color:#ef6c00;">${st.balance || 0}</b></span>
                        <span>🎁 Покупок: <b>${invCount}</b></span>
                        <span>Регистрация: ${new Date(st.createdAt).toLocaleDateString('ru-RU')}</span>
                    </div>
                </div>
            </div>
        `;
        list.appendChild(card);
    });
}

/* ====== УЧИТЕЛЬ: МАГАЗИН ====== */
function renderShopManage() {
    const list = $('shopManageList');
    if (!list) return;

    let html = `<div style="margin-bottom:16px;">
        <button class="btn btn-primary" id="createProductBtn">+ Добавить товар</button>
    </div>`;

    const items = Object.entries(allProducts).map(([id, p]) => ({ ...p, id })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

    if (items.length === 0) {
        html += '<div class="empty">Товаров пока нет</div>';
    } else {
        html += `<div class="shop-grid">`;
        items.forEach(p => {
            const typeInfo = PRODUCT_TYPES[p.type] || { name: 'Товар', icon: '📦' };
            html += `<div class="shop-item">
                <div class="shop-preview">${p.imageData ? `<img src="${p.imageData}" alt="">` : (p.icon || typeInfo.icon)}</div>
                <div class="shop-name">${escapeHtml(p.name)}</div>
                <div class="shop-desc">${escapeHtml(p.desc || '')}</div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="shop-price">🪙 ${p.price}</span>
                    <span class="badge badge-gray">${typeInfo.name}</span>
                </div>
                <div class="shop-actions">
                    <button class="btn btn-outline btn-sm" data-edit-p="${p.id}">Изменить</button>
                    <button class="btn btn-danger btn-sm" data-del-p="${p.id}">Удалить</button>
                </div>
            </div>`;
        });
        html += `</div>`;
    }

    list.innerHTML = html;

    $('createProductBtn').addEventListener('click', () => openProductModal(null));
    list.querySelectorAll('[data-edit-p]').forEach(b => b.addEventListener('click', () => {
        openProductModal(allProducts[b.dataset.editP], b.dataset.editP);
    }));
    list.querySelectorAll('[data-del-p]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Удалить товар?')) return;
        await fb.remove(fb.ref('teachlexa/products/' + b.dataset.delP));
        toast('Товар удалён');
    }));
}

function openProductModal(product, id) {
    editingProductId = id || null;
    productImageData = product && product.imageData ? product.imageData : null;

    const isEdit = !!product;
    $('productModalTitle').textContent = isEdit ? 'Редактирование товара' : 'Новый товар';

    const content = $('productModalContent');
    content.innerHTML = `
        <div class="field">
            <label>Название</label>
            <input type="text" id="pName" value="${escapeHtml(product ? product.name : '')}" placeholder="Например: Золотая рамка">
        </div>
        <div class="field">
            <label>Описание</label>
            <textarea id="pDesc" placeholder="Что даёт этот товар">${escapeHtml(product ? product.desc : '')}</textarea>
        </div>
        <div class="grid-2">
            <div class="field">
                <label>Цена (баллы)</label>
                <input type="number" id="pPrice" min="1" value="${product ? product.price : 100}">
            </div>
            <div class="field">
                <label>Тип</label>
                <select id="pType">
                    <option value="avatar">Аватарка (картинка)</option>
                    <option value="frame">Рамка (цветная обводка)</option>
                    <option value="nickcolor">Цвет ника</option>
                    <option value="emoji">Эмодзи рядом с именем</option>
                    <option value="badge">Значок в профиле</option>
                </select>
            </div>
        </div>
        <div class="field" id="pIconField">
            <label>Эмодзи / иконка</label>
            <input type="text" id="pIcon" value="${escapeHtml(product && product.icon || '')}" placeholder="🔥" maxlength="4">
        </div>
        <div class="field" id="pColorField" style="display:none;">
            <label>Цвет</label>
            <select id="pColor">
                <option value="red">Красный</option>
                <option value="blue">Синий</option>
                <option value="green">Зелёный</option>
                <option value="gold">Золотой</option>
                <option value="purple">Фиолетовый</option>
            </select>
        </div>
        <div class="field">
            <label>Картинка (необязательно, для аватарки)</label>
            <input type="file" id="pImage" accept="image/*">
            <div id="pImagePreview" style="margin-top:10px;"></div>
        </div>
        <button class="btn btn-primary btn-block" id="saveProductBtn">Сохранить товар</button>
    `;

    const typeSelect = $('pType');
    if (product) typeSelect.value = product.type || 'avatar';
    if (product && product.color) $('pColor').value = product.color;

    const updateFieldsByType = () => {
        const t = typeSelect.value;
        $('pColorField').style.display = t === 'nickcolor' ? 'block' : 'none';
        $('pIconField').style.display = (t === 'emoji' || t === 'badge') ? 'block' : 'none';
    };
    updateFieldsByType();
    typeSelect.addEventListener('change', updateFieldsByType);

    const renderPreview = () => {
        const prev = $('pImagePreview');
        if (productImageData) prev.innerHTML = `<img src="${productImageData}" style="max-width:140px; border-radius:8px; border:1px solid #e0e4ea;">`;
        else prev.innerHTML = '';
    };
    renderPreview();

    $('pImage').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const compressed = await compressImage(file, 400, 0.85);
        if (compressed) { productImageData = compressed; renderPreview(); }
    });

    $('saveProductBtn').addEventListener('click', async () => {
        const name = $('pName').value.trim();
        const desc = $('pDesc').value.trim();
        const price = parseInt($('pPrice').value) || 0;
        const type = $('pType').value;
        const icon = $('pIcon').value.trim();
        const color = $('pColor').value;

        if (!name) return toast('Введите название', 'error');
        if (price <= 0) return toast('Цена должна быть больше 0', 'error');

        const data = { name, desc, price, type, createdAt: Date.now() };
        if (icon) data.icon = icon;
        if (productImageData) data.imageData = productImageData;
        if (type === 'nickcolor') {
            data.color = color;
            data.colorValue = NICK_COLOR_VALUES[color];
        }
        if (type === 'frame') {
            data.frameColor = NICK_COLOR_VALUES[color] || '#2196F3';
        }

        try {
            if (editingProductId) {
                await fb.update(fb.ref('teachlexa/products/' + editingProductId), data);
                toast('Товар обновлён');
            } else {
                const ref = fb.push(fb.ref('teachlexa/products'));
                await fb.set(ref, data);
                toast('Товар создан');
            }
            closeModal('productModal');
        } catch (e) { console.error(e); toast('Ошибка: ' + (e.message || e), 'error'); }
    });

    openModal('productModal');
}

/* ====== УЧЕНИК: ЗАДАНИЯ ====== */
function renderStudentTasks(tasks) {
    const byCat = { vpr: {}, kr: {}, dz: {}, oge: {}, ege: {} };
    Object.entries(tasks).forEach(([id, t]) => {
        const cat = t.category || 'dz';
        if (byCat[cat]) byCat[cat][id] = t;
    });

    fb.get(fb.ref('teachlexa/submissions')).then(subSnap => {
        const subs = subSnap.val() || {};
        const mySubs = {};
        Object.entries(subs).forEach(([id, s]) => {
            if (s.studentKey === currentUserKey) mySubs[s.taskId] = { ...s, id };
        });

        Object.keys(byCat).forEach(cat => {
            const filtered = {};
            Object.entries(byCat[cat]).forEach(([id, t]) => {
                if (currentSubjectFilter === 'all' || t.subject === currentSubjectFilter) {
                    filtered[id] = t;
                }
            });
            renderCategoryList($(CATEGORIES[cat].listId), filtered, mySubs);
        });
    });
}

function renderCategoryList(listEl, tasks, mySubs) {
    if (!listEl) return;
    const all = Object.entries(tasks).map(([id, t]) => ({ ...t, id })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

    if (all.length === 0) {
        listEl.innerHTML = '<div class="empty">В этой категории заданий пока нет</div>';
        return;
    }

    listEl.innerHTML = '';
    all.forEach(task => {
        const sub = mySubs[task.id];
        const card = document.createElement('div');
        card.className = 'card';
        const isExam = CATEGORIES[task.category || 'dz'].isExam;

        let statusBadge = '', actionBtn = '';

        if (!sub) {
            statusBadge = '<span class="badge badge-blue">Новое</span>';
            actionBtn = `<button class="btn btn-primary btn-sm" style="margin-top:14px;" data-start="${task.id}">Начать выполнение</button>`;
        } else if (sub.status === 'submitted') {
            statusBadge = '<span class="badge badge-yellow">На проверке</span>';
            actionBtn = `<div style="color:#6b7280; font-size:13px; margin-top:14px;">Работа отправлена на проверку</div>`;
        } else if (sub.status === 'graded') {
            statusBadge = '<span class="badge badge-green">Проверено</span>';
            let resultHtml = '';
            if (isExam && sub.score != null) resultHtml = `<div class="score-display">${sub.score} / ${sub.maxScore}</div>`;
            else if (sub.grade) resultHtml = `<div class="grade grade-${sub.grade}">${sub.grade}</div>`;
            actionBtn = `<div style="display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap;">
                ${resultHtml}
                ${sub.points ? `<span class="badge badge-orange">🪙 +${sub.points} баллов</span>` : ''}
            </div>`;
        }

        const deadlineText = task.deadline
            ? new Date(task.deadline).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit' })
            : 'без дедлайна';

        card.innerHTML = `
            <div class="card-header">
                <div style="flex:1; min-width:200px;">
                    <div class="card-title">${escapeHtml(task.title)}</div>
                    <div class="card-meta" style="margin-top:10px;">
                        <span class="badge badge-gray">${SUBJECTS[task.subject] || 'Без предмета'}</span>
                        <span>📅 ${deadlineText}</span>
                        <span>⏱ ${task.timerMin} мин</span>
                        <span>📝 ${task.questions.length} вопросов</span>
                        ${task.maxPoints ? `<span class="badge badge-orange">🪙 до ${task.maxPoints}</span>` : ''}
                        ${task.maxScore ? `<span class="badge badge-green">Макс: ${task.maxScore} б.</span>` : ''}
                    </div>
                </div>
                ${statusBadge}
            </div>
            ${task.desc ? `<div class="card-desc">${escapeHtml(task.desc)}</div>` : ''}
            ${actionBtn}
        `;

        const startBtn = card.querySelector('[data-start]');
        if (startBtn) startBtn.addEventListener('click', () => startTask(task));

        listEl.appendChild(card);
    });
}

/* ====== ПРОХОЖДЕНИЕ ====== */
function startTask(task) {
    currentTask = task;
    currentAnswers = task.questions.map(() => ({ text: '', answered: false }));
    currentQuestionIdx = 0;
    workFinished = false;
    $('workModalTitle').textContent = task.title;
    $('closeWorkModalBtn').style.display = 'block';
    renderWorkModal();
    openModal('workModal');

    if (activeTimer) clearInterval(activeTimer);
    let secondsLeft = task.timerMin * 60;
    const timerEl = $('timerDisplay');
    timerEl.classList.add('active');
    timerEl.classList.remove('warning');
    const upd = () => {
        const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const s = String(secondsLeft % 60).padStart(2, '0');
        timerEl.textContent = m + ':' + s;
        if (secondsLeft <= 60) timerEl.classList.add('warning');
        if (secondsLeft <= 0) {
            clearInterval(activeTimer); activeTimer = null;
            timerEl.classList.remove('active');
            toast('Время вышло! Работа отправляется...', 'error');
            finishWork(true);
        }
        secondsLeft--;
    };
    upd();
    activeTimer = setInterval(upd, 1000);
}

function renderWorkModal() {
    const content = $('workModalContent');
    const task = currentTask;
    if (workFinished) return;

    let navHtml = `<div class="q-nav">`;
    task.questions.forEach((q, i) => {
        const ans = currentAnswers[i];
        navHtml += `<button class="q-nav-circle ${ans.answered ? 'answered' : ''} ${i === currentQuestionIdx ? 'active' : ''}" data-goto="${i}">
            ${i + 1}
            ${ans.answered ? '<span class="check">✓</span>' : ''}
        </button>`;
    });
    navHtml += `</div>`;

    const answeredCount = currentAnswers.filter(a => a.answered).length;
    const progressHtml = `<div class="q-progress">
        <span>Отвечено: ${answeredCount} из ${task.questions.length}</span>
        <span>Вопрос ${currentQuestionIdx + 1} из ${task.questions.length}</span>
    </div>`;

    let stepsHtml = '';
    task.questions.forEach((q, i) => {
        const ans = currentAnswers[i];
        stepsHtml += `<div class="q-step ${i === currentQuestionIdx ? 'active' : ''}" data-step="${i}">`;
        stepsHtml += `<div class="q-step-title"><span class="num-badge">Вопрос ${i+1}</span></div>`;
        stepsHtml += `<div class="q-step-text">${escapeHtml(q.text)}</div>`;

        if (q.files && q.files.length) {
            stepsHtml += `<div style="margin-bottom:16px;" data-sf="${i}">${renderFilesForView(q.files, 'st' + i)}</div>`;
        }

        stepsHtml += `<div class="q-step-answers">`;
        if (q.type === 'choice') {
            q.answers.forEach((a, ai) => {
                const sel = (ans.text === a.text && ans.answered) ? 'selected' : '';
                stepsHtml += `<label class="q-step-answer ${sel}">
                    <input type="radio" name="wq${i}" ${sel ? 'checked' : ''} data-wq="${i}" data-wa="${ai}">
                    <span class="ans-text">${escapeHtml(a.text)}</span>
                </label>`;
            });
        } else {
            stepsHtml += `<textarea class="q-step-textarea" data-wt="${i}" placeholder="Введите ответ...">${escapeHtml(ans.text || '')}</textarea>`;
        }
        stepsHtml += `</div>`;

        const isLast = i === task.questions.length - 1;
        stepsHtml += `<div class="q-step-nav">`;
        if (i > 0) stepsHtml += `<button class="prev" data-prev="${i}">Назад</button>`;
        if (!isLast) stepsHtml += `<button class="next" data-next="${i}">Далее</button>`;
        else stepsHtml += `<button class="finish" data-finish="1">Завершить</button>`;
        stepsHtml += `</div>`;

        stepsHtml += `</div>`;
    });

    content.innerHTML = navHtml + progressHtml + stepsHtml;

    content.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => {
        currentQuestionIdx = parseInt(b.dataset.goto);
        renderWorkModal();
    }));
    content.querySelectorAll('.q-step-answer').forEach(lbl => {
        lbl.addEventListener('click', () => {
            const inp = lbl.querySelector('input');
            const qi = parseInt(inp.dataset.wq);
            const ai = parseInt(inp.dataset.wa);
            currentAnswers[qi].text = task.questions[qi].answers[ai].text;
            currentAnswers[qi].answered = true;
            renderWorkModal();
        });
    });
    content.querySelectorAll('.q-step-textarea').forEach(ta => {
        ta.addEventListener('input', () => {
            const qi = parseInt(ta.dataset.wt);
            currentAnswers[qi].text = ta.value;
            currentAnswers[qi].answered = ta.value.trim().length > 0;
            const circle = content.querySelector(`[data-goto="${qi}"]`);
            if (circle) {
                if (currentAnswers[qi].answered && !circle.classList.contains('answered')) {
                    circle.classList.add('answered');
                    if (!circle.querySelector('.check')) {
                        const cm = document.createElement('span');
                        cm.className = 'check'; cm.textContent = '✓';
                        circle.appendChild(cm);
                    }
                } else if (!currentAnswers[qi].answered && circle.classList.contains('answered')) {
                    circle.classList.remove('answered');
                    const cm = circle.querySelector('.check');
                    if (cm) cm.remove();
                }
            }
        });
    });
    content.querySelectorAll('[data-prev]').forEach(b => b.addEventListener('click', () => {
        currentQuestionIdx = Math.max(0, parseInt(b.dataset.prev) - 1);
        renderWorkModal();
    }));
    content.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', () => {
        currentQuestionIdx = Math.min(task.questions.length - 1, parseInt(b.dataset.next) + 1);
        renderWorkModal();
    }));
    content.querySelectorAll('[data-finish]').forEach(b => b.addEventListener('click', confirmFinish));

    task.questions.forEach((q, i) => {
        if (q.files && q.files.length) {
            const wrap = content.querySelector(`[data-sf="${i}"]`);
            if (wrap) attachFileClickHandlers(wrap, q.files);
        }
    });
}

function confirmFinish() {
    const unanswered = [];
    currentAnswers.forEach((a, i) => { if (!a.answered) unanswered.push(i + 1); });

    let msg = unanswered.length === 0
        ? 'Вы ответили на все вопросы. Завершить работу?'
        : 'Вы не ответили на вопросы: ' + unanswered.join(', ') + '. Всё равно завершить?';
    if (confirm(msg)) finishWork(false);
}

async function finishWork(forced) {
    if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
    $('timerDisplay').classList.remove('active');

    try {
        const task = currentTask;
        let autoGrade = null;
        if (task.mode === 'auto') {
            let correct = 0;
            task.questions.forEach((q, i) => {
                const ans = currentAnswers[i].text;
                if (q.type === 'choice') {
                    const correctAns = (q.answers.find(a => a.correct) || {}).text;
                    if (correctAns && ans === correctAns) correct++;
                } else {
                    if (q.checkMode !== 'manual' && q.correctText.trim().toLowerCase() === ans.trim().toLowerCase()) correct++;
                }
            });
            const pct = correct / task.questions.length;
            if (pct >= 0.85) autoGrade = 5;
            else if (pct >= 0.65) autoGrade = 4;
            else if (pct >= 0.45) autoGrade = 3;
            else autoGrade = 2;
        }

        const subRef = fb.push(fb.ref('teachlexa/submissions'));
        const subData = {
            taskId: task.id,
            taskTitle: task.title,
            taskCategory: task.category || 'dz',
            category: task.category || 'dz',
            subject: task.subject || 'algebra',
            studentKey: currentUserKey,
            studentName: currentUser.name,
            answers: currentAnswers.map(a => ({ text: a.text })),
            submittedAt: Date.now(),
            status: autoGrade ? 'graded' : 'submitted'
        };
        if (autoGrade) { subData.grade = autoGrade; subData.gradedAt = Date.now(); }
        await fb.set(subRef, subData);

        workFinished = true;
        showFinishScreen(autoGrade);
    } catch (e) { console.error(e); toast('Ошибка: ' + (e.message || e), 'error'); }
}

function showFinishScreen(autoGrade) {
    $('closeWorkModalBtn').style.display = 'none';
    const content = $('workModalContent');
    const isExam = CATEGORIES[currentTask.category || 'dz'].isExam;

    let resultBlock = '';
    if (autoGrade && !isExam) {
        resultBlock = `<div style="margin:20px 0; display:flex; align-items:center; justify-content:center; gap:16px;">
            <div class="grade grade-${autoGrade}" style="width:72px; height:72px; font-size:32px;">${autoGrade}</div>
            <div style="color:#6b7280; font-size:15px;">Ваша оценка</div>
        </div>`;
    }

    content.innerHTML = `
        <div class="finish-screen">
            <span class="finish-icon">✅</span>
            <h2>Работа отправлена</h2>
            <p>Учитель скоро проверит её и выставит оценку. Результат появится в разделе «Мои оценки».</p>
            ${resultBlock}
            <button class="btn btn-primary" id="backToListBtn" style="padding:12px 28px;">Вернуться к заданиям</button>
        </div>
    `;

    $('backToListBtn').addEventListener('click', () => {
        closeModal('workModal');
        const map = { vpr: 's_vpr', kr: 's_kr', dz: 's_dz', oge: 's_oge', ege: 's_ege' };
        switchTab(map[currentTask.category || 'dz'] || 's_dz');
    });
}

/* ====== УЧЕНИК: МОИ ОЦЕНКИ ====== */
function renderResults(submissions) {
    const list = $('resultsList');
    if (!list || !currentUser) return;

    const mySubs = Object.entries(submissions)
        .map(([id, s]) => ({ ...s, id }))
        .filter(s => s.studentKey === currentUserKey)
        .sort((a,b) => (b.submittedAt||0) - (a.submittedAt||0));

    if (mySubs.length === 0) { list.innerHTML = '<div class="empty">Вы ещё не сдали ни одной работы</div>'; return; }

    const graded = mySubs.filter(s => s.status === 'graded');
    let totalSum = 0, countSum = 0, totalPoints = 0;
    graded.forEach(s => {
        if (s.grade) { totalSum += s.grade; countSum++; }
        else if (s.score != null && s.maxScore) { totalSum += (s.score / s.maxScore) * 5; countSum++; }
        if (s.points) totalPoints += s.points;
    });
    const avg = countSum > 0 ? (totalSum / countSum) : 0;
    const avgStr = countSum > 0 ? (avg % 1 === 0 ? avg.toString() : avg.toFixed(2)) : '—';

    const bySubject = {};
    Object.keys(SUBJECTS).forEach(k => { bySubject[k] = { sum: 0, count: 0, points: 0 }; });
    graded.forEach(s => {
        const subj = s.subject || 'algebra';
        if (!bySubject[subj]) bySubject[subj] = { sum: 0, count: 0, points: 0 };
        if (s.grade) { bySubject[subj].sum += s.grade; bySubject[subj].count++; }
        else if (s.score != null && s.maxScore) { bySubject[subj].sum += (s.score / s.maxScore) * 5; bySubject[subj].count++; }
        if (s.points) bySubject[subj].points += s.points;
    });

    const byCategory = {};
    Object.keys(CATEGORIES).forEach(k => { byCategory[k] = { sum: 0, count: 0 }; });
    graded.forEach(s => {
        const cat = s.category || 'dz';
        if (!byCategory[cat]) byCategory[cat] = { sum: 0, count: 0 };
        if (s.grade) { byCategory[cat].sum += s.grade; byCategory[cat].count++; }
        else if (s.score != null && s.maxScore) { byCategory[cat].sum += (s.score / s.maxScore) * 5; byCategory[cat].count++; }
    });

    let html = `<div class="stats-grid">
        <div class="stat-box blue"><div class="val">${avgStr}</div><div class="lbl">Средний балл</div></div>
        <div class="stat-box green"><div class="val">${graded.length}</div><div class="lbl">Проверенных работ</div></div>
        <div class="stat-box orange"><div class="val">${totalPoints}</div><div class="lbl">Заработано баллов</div></div>
        <div class="stat-box purple"><div class="val">${userBalance}</div><div class="lbl">Текущий баланс 🪙</div></div>
    </div>`;

    html += `<div class="breakdown"><h3>По предметам</h3>`;
    Object.keys(bySubject).forEach(k => {
        const s = bySubject[k];
        if (s.count === 0 && s.points === 0) return;
        const a = s.count > 0 ? s.sum / s.count : 0;
        const aStr = s.count > 0 ? (a % 1 === 0 ? a.toString() : a.toFixed(2)) : '—';
        html += `<div class="breakdown-row">
            <div class="name">${SUBJECTS[k]}</div>
            <div class="stats">
                <span>Средний: <b>${aStr}</b></span>
                <span>Работ: <b>${s.count}</b></span>
                ${s.points ? `<span>🪙 <b>${s.points}</b></span>` : ''}
            </div>
        </div>`;
    });
    html += `</div>`;

    html += `<div class="breakdown"><h3>По категориям</h3>`;
    Object.keys(byCategory).forEach(k => {
        const s = byCategory[k];
        if (s.count === 0) return;
        const a = s.sum / s.count;
        const aStr = a % 1 === 0 ? a.toString() : a.toFixed(2);
        html += `<div class="breakdown-row">
            <div class="name">${CATEGORIES[k].name}</div>
            <div class="stats"><span>Средний: <b>${aStr}</b></span><span>Работ: <b>${s.count}</b></span></div>
        </div>`;
    });
    html += `</div>`;

    html += `<div class="breakdown"><h3>История работ</h3>`;
    mySubs.forEach(sub => {
        const isExam = CATEGORIES[sub.category || 'dz'].isExam;
        let resultHtml = '';
        if (sub.status === 'graded') {
            if (isExam && sub.score != null) resultHtml = `<div class="score-display">${sub.score} / ${sub.maxScore}</div>`;
            else if (sub.grade) resultHtml = `<div class="grade grade-${sub.grade}">${sub.grade}</div>`;
        } else {
            resultHtml = `<span class="badge badge-yellow">На проверке</span>`;
        }
        html += `<div class="breakdown-row">
            <div>
                <div class="name">${escapeHtml(sub.taskTitle)}</div>
                <div class="stats" style="margin-top:6px;">
                    <span class="badge badge-blue">${CATEGORIES[sub.category || 'dz'].name}</span>
                    <span class="badge badge-gray">${SUBJECTS[sub.subject] || ''}</span>
                    <span>${new Date(sub.submittedAt).toLocaleString('ru-RU')}</span>
                    ${sub.points ? `<span class="badge badge-orange">🪙 +${sub.points}</span>` : ''}
                </div>
            </div>
            <div>${resultHtml}</div>
        </div>`;
    });
    html += `</div>`;

    list.innerHTML = html;
}

/* ====== УЧЕНИК: МАГАЗИН ====== */
function renderShop() {
    const list = $('shopList');
    if (!list) return;

    const items = Object.entries(allProducts).map(([id, p]) => ({ ...p, id }));

    let html = `<div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
        <div class="stat-box orange"><div class="val">🪙 ${userBalance}</div><div class="lbl">Ваш баланс</div></div>
    </div>`;

    if (items.length === 0) {
        html += '<div class="empty">Магазин пуст. Учитель пока ничего не добавил.</div>';
        list.innerHTML = html;
        return;
    }

    html += `<div class="shop-grid">`;
    items.forEach(p => {
        const owned = !!userInventory[p.id];
        const equipped = userEquipped[p.type] === p.id;
        const canBuy = !owned && userBalance >= p.price;
        const typeInfo = PRODUCT_TYPES[p.type] || { name: 'Товар', icon: '📦' };

        html += `<div class="shop-item">
            <div class="shop-preview">${p.imageData ? `<img src="${p.imageData}" alt="">` : (p.icon || typeInfo.icon)}</div>
            <div class="shop-name">${escapeHtml(p.name)}</div>
            <div class="shop-desc">${escapeHtml(p.desc || '')}</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="shop-price">🪙 ${p.price}</span>
                <span class="badge badge-gray">${typeInfo.name}</span>
            </div>
            <div class="shop-actions">
                ${owned
                    ? (equipped
                        ? `<button class="btn btn-gray btn-sm" style="width:100%;" disabled>Надето</button>`
                        : `<button class="btn btn-success btn-sm" style="width:100%;" data-equip="${p.id}">Надеть</button>`)
                    : `<button class="btn ${canBuy ? 'btn-primary' : 'btn-gray'} btn-sm" style="width:100%;" data-buy="${p.id}" ${canBuy ? '' : 'disabled'}>
                        ${canBuy ? 'Купить' : (userBalance < p.price ? 'Не хватает баллов' : 'Купить')}
                    </button>`}
            </div>
        </div>`;
    });
    html += `</div>`;

    list.innerHTML = html;
    list.querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => buyProduct(b.dataset.buy)));
    list.querySelectorAll('[data-equip]').forEach(b => b.addEventListener('click', () => equipProduct(b.dataset.equip)));
}

async function buyProduct(id) {
    const p = allProducts[id];
    if (!p) return;
    if (userBalance < p.price) return toast('Недостаточно баллов', 'error');
    if (!confirm('Купить «' + p.name + '» за ' + p.price + ' баллов?')) return;

    try {
        const userRef = fb.ref('teachlexa/users/' + currentUserKey);
        const userSnap = await userRef.get();
        const userData = userSnap.val() || {};
        const balance = userData.balance || 0;
        const inventory = userData.inventory || {};
        if (balance < p.price) return toast('Недостаточно баллов', 'error');

        inventory[id] = {
            name: p.name, type: p.type, icon: p.icon || null,
            imageData: p.imageData || null,
            color: p.color || null, colorValue: p.colorValue || null,
            frameColor: p.frameColor || null, boughtAt: Date.now()
        };

        await fb.update(userRef, { balance: balance - p.price, inventory });
        toast('Покупка успешна!');
    } catch (e) { console.error(e); toast('Ошибка: ' + (e.message || e), 'error'); }
}

async function equipProduct(id) {
    const item = userInventory[id];
    if (!item) return;
    try {
        const userRef = fb.ref('teachlexa/users/' + currentUserKey);
        const userSnap = await userRef.get();
        const userData = userSnap.val() || {};
        const equipped = userData.equipped || {};
        const key = item.type;

        if (equipped[key] === id) {
            delete equipped[key];
            await fb.update(userRef, { equipped });
            toast('Снято');
        } else {
            equipped[key] = id;
            await fb.update(userRef, { equipped });
            toast('Надето');
        }
    } catch (e) { console.error(e); toast('Ошибка: ' + (e.message || e), 'error'); }
}

/* ====== УЧЕНИК: ПРОФИЛЬ ====== */
function renderProfile() {
    const content = $('profileContent');
    if (!content) return;

    const history = currentUser.pointsHistory || {};
    const historyArr = Object.entries(history)
        .map(([id, h]) => ({ ...h, id }))
        .sort((a,b) => (b.at||0) - (a.at||0))
        .slice(0, 20);

    let html = `<div class="stats-grid">
        <div class="stat-box orange"><div class="val">🪙 ${userBalance}</div><div class="lbl">Баланс</div></div>
        <div class="stat-box blue"><div class="val">${Object.keys(userInventory).length}</div><div class="lbl">Покупок</div></div>
    </div>`;

    html += `<div class="breakdown"><h3>История начислений</h3>`;
    if (historyArr.length === 0) {
        html += `<div style="color:#6b7280; font-size:14px; padding:10px 0;">Пока нет начислений</div>`;
    } else {
        historyArr.forEach(h => {
            html += `<div class="breakdown-row">
                <div>
                    <div class="name">${escapeHtml(h.taskTitle || '—')}</div>
                    <div class="stats" style="margin-top:6px;"><span>${new Date(h.at).toLocaleString('ru-RU')}</span></div>
                </div>
                <span class="badge badge-orange">🪙 +${h.amount}</span>
            </div>`;
        });
    }
    html += `</div>`;

    html += `<div class="breakdown"><h3>Инвентарь</h3>`;
    if (Object.keys(userInventory).length === 0) {
        html += `<div style="color:#6b7280; font-size:14px; padding:10px 0;">Пусто. Купите что-нибудь в магазине.</div>`;
    } else {
        html += `<div class="inventory-grid">`;
        Object.entries(userInventory).forEach(([id, item]) => {
            const equipped = userEquipped[item.type] === id;
            const typeInfo = PRODUCT_TYPES[item.type] || { icon: '📦' };
            html += `<div class="inventory-item ${equipped ? 'equipped' : ''}">
                <div class="inventory-preview">${item.imageData ? `<img src="${item.imageData}" alt="">` : (item.icon || typeInfo.icon)}</div>
                <div style="font-weight:600; font-size:13px;">${escapeHtml(item.name)}</div>
                ${equipped
                    ? `<button class="btn btn-gray btn-sm" data-unequip="${id}" style="width:100%;">Снять</button>`
                    : `<button class="btn btn-success btn-sm" data-eq="${id}" style="width:100%;">Надеть</button>`}
            </div>`;
        });
        html += `</div>`;
    }
    html += `</div>`;

    content.innerHTML = html;
    content.querySelectorAll('[data-eq]').forEach(b => b.addEventListener('click', () => equipProduct(b.dataset.eq)));
    content.querySelectorAll('[data-unequip]').forEach(b => b.addEventListener('click', () => equipProduct(b.dataset.unequip)));
}

/* ====== АВТОПОДГОНКА ====== */
document.addEventListener('input', (e) => {
    if (e.target.tagName === 'TEXTAREA' && !['studentPassword', 'teacherPassword'].includes(e.target.id)) {
        autoResize(e.target);
    }
});
window.addEventListener('load', () => { document.querySelectorAll('textarea').forEach(autoResize); });

$('workModal').addEventListener('click', (e) => { if (e.target === $('workModal')) {} });
$('closeWorkModalBtn').addEventListener('click', () => {
    if (workFinished) closeModal('workModal');
    else {
        if (confirm('Выйти без отправки? Ответы не сохранятся.')) {
            if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
            $('timerDisplay').classList.remove('active');
            closeModal('workModal');
        }
    }
});

document.querySelectorAll('.tab[data-tab="s_profile"]').forEach(t => {
    t.addEventListener('click', () => setTimeout(renderProfile, 50));
});
document.querySelectorAll('.tab[data-tab="s_shop"]').forEach(t => {
    t.addEventListener('click', () => setTimeout(renderShop, 50));
});
</script>
