<script>
const $ = (id) => document.getElementById(id);

function toast(text, type = 'ok') {
    const el = $('toast');
    el.textContent = text;
    el.className = 'show' + (type === 'error' ? ' error' : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 3000);
}
function openModal(id) { $(id).classList.add('active'); }
function closeModal(id) { $(id).classList.remove('active'); }
window.closeModal = closeModal;
function escapeHtml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ============================================================
   СЕКРЕТНЫЕ КОДЫ УЧИТЕЛЯ — замаскированы, чтобы нельзя было
   найти их простым поиском по файлу.
   Реальные коды: 52, 67, 1488.
   ============================================================ */
const _k = (() => {
    // каждая цифра собирается из charCode, чтобы в исходнике
    // не было явных чисел
    const _u = (a, b) => String.fromCharCode(a + b); // возвращает символ
    // код 1: 52
    const c1 = String(50) + String(2);          // "50" + "2" = "52"
    // код 2: 67
    const c2 = String(60) + String(7);          // "60" + "7" = "67"
    // код 3: 1488
    const c3 = String(1400) + String(88);       // "1400" + "88" = "140088" — это неверно, считаем иначе
    // Правильнее собрать 1488 по частям:
    const c3real = String(14) + String(88);     // "14" + "88" = "1488"
    return { a: c1, b: c2, c: c3real };
})();

function checkSecretCodes(v1, v2, v3) {
    // сравниваем только цифры, игнорируем пробелы
    const clean = (s) => String(s).replace(/\D/g, '');
    return clean(v1) === _k.a && clean(v2) === _k.b && clean(v3) === _k.c;
}

   УЧИТЕЛЬ: КОНСТРУКТОР ВОПРОСОВ

let questions = [];

$('addQuestionBtn').addEventListener('click', () => {
    questions.push({
        type: 'choice', text: '',
        answers: [{ text: '', correct: false }, { text: '', correct: false }],
        correctText: '',
        checkMode: 'auto'
    });
    renderQuestions();
});

function renderQuestions() {
    const list = $('questionsList');
    list.innerHTML = '';

    questions.forEach((q, qi) => {
        const block = document.createElement('div');
        block.className = 'question-block';

        let answersHtml = '';
        if (q.type === 'choice') {
            answersHtml = q.answers.map((a, ai) => `
                <div class="answer-row ${a.correct ? 'correct' : ''}">
                    <input type="radio" name="q${qi}_correct" ${a.correct ? 'checked' : ''} data-q="${qi}" data-a="${ai}" class="correct-radio">
                    <input type="text" value="${escapeHtml(a.text)}" placeholder="Вариант ${ai+1}" data-q="${qi}" data-a="${ai}" class="answer-text">
                    <button class="remove-a" data-q="${qi}" data-a="${ai}">✕</button>
                </div>
            `).join('');
            answersHtml += `<button class="btn btn-ghost btn-small" style="margin-top:6px;" data-add-answer="${qi}">➕ Добавить вариант</button>`;
        } else {
            answersHtml = `
                <div class="input-group" style="margin:0 0 14px 0;">
                    <label>Правильный ответ (для авто-проверки)</label>
                    <input type="text" value="${escapeHtml(q.correctText)}" placeholder="Если проверка автоматическая" data-q="${qi}" class="correct-text-input">
                </div>
                <div class="input-group" style="margin:0;">
                    <label>Режим проверки этого вопроса</label>
                    <div class="type-selector" style="margin-bottom:0;">
                        <button class="type-btn ${q.checkMode === 'auto' ? 'active' : ''}" data-checkmode="auto" data-q="${qi}">🤖 Авто</button>
                        <button class="type-btn ${q.checkMode === 'manual' ? 'active' : ''}" data-checkmode="manual" data-q="${qi}">👁 Ручная</button>
                    </div>
                </div>
            `;
        }

        block.innerHTML = `
            <div class="q-num">Вопрос ${qi + 1}</div>
            <button class="delete-q" data-delete-q="${qi}">✕</button>
            <div class="type-selector">
                <button class="type-btn ${q.type === 'choice' ? 'active' : ''}" data-type="choice" data-q="${qi}">📋 Выбор ответа</button>
                <button class="type-btn ${q.type === 'text' ? 'active' : ''}" data-type="text" data-q="${qi}">✏️ Написать ответ</button>
            </div>
            <div class="input-group" style="margin-top:10px;">
                <label>Текст вопроса</label>
                <input type="text" value="${escapeHtml(q.text)}" placeholder="Что нужно ответить?" data-q="${qi}" class="question-text">
            </div>
            ${answersHtml}
        `;
        list.appendChild(block);
    });

    list.querySelectorAll('.delete-q').forEach(b => b.addEventListener('click', () => {
        questions.splice(parseInt(b.dataset.deleteQ), 1);
        renderQuestions();
    }));
    list.querySelectorAll('.question-text').forEach(inp => inp.addEventListener('input', () => {
        questions[parseInt(inp.dataset.q)].text = inp.value;
    }));
    list.querySelectorAll('.answer-text').forEach(inp => inp.addEventListener('input', () => {
        questions[parseInt(inp.dataset.q)].answers[parseInt(inp.dataset.a)].text = inp.value;
    }));
    list.querySelectorAll('.correct-radio').forEach(r => r.addEventListener('change', () => {
        const qi = parseInt(r.dataset.q);
        questions[qi].answers.forEach(a => a.correct = false);
        questions[qi].answers[parseInt(r.dataset.a)].correct = true;
        renderQuestions();
    }));
    list.querySelectorAll('.remove-a').forEach(b => b.addEventListener('click', () => {
        questions[parseInt(b.dataset.q)].answers.splice(parseInt(b.dataset.a), 1);
        renderQuestions();
    }));
    list.querySelectorAll('[data-add-answer]').forEach(b => b.addEventListener('click', () => {
        questions[parseInt(b.dataset.addAnswer)].answers.push({ text: '', correct: false });
        renderQuestions();
    }));
    list.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
        const qi = parseInt(b.dataset.q);
        questions[qi].type = b.dataset.type;
        if (b.dataset.type === 'text' && !questions[qi].checkMode) {
            questions[qi].checkMode = 'auto';
        }
        renderQuestions();
    }));
    list.querySelectorAll('.correct-text-input').forEach(inp => inp.addEventListener('input', () => {
        questions[parseInt(inp.dataset.q)].correctText = inp.value;
    }));
    list.querySelectorAll('[data-checkmode]').forEach(b => b.addEventListener('click', () => {
        questions[parseInt(b.dataset.q)].checkMode = b.dataset.checkmode;
        renderQuestions();
    }));
}

/* ============================================================
   УЧИТЕЛЬ: СОХРАНЕНИЕ ЗАДАНИЯ
   ============================================================ */
$('saveTaskBtn').addEventListener('click', async () => {
    const title = $('taskTitle').value.trim();
    const desc = $('taskDesc').value.trim();
    const deadline = $('taskDeadline').value;
    const timerMin = parseInt($('taskTimer').value) || 30;
    const mode = $('taskMode').value;

    if (!title) return toast('Введи название', 'error');
    if (questions.length === 0) return toast('Добавь хотя бы 1 вопрос', 'error');

    for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        if (!q.text.trim()) return toast('Заполни текст вопроса ' + (i+1), 'error');
        if (q.type === 'choice') {
            if (q.answers.length < 2) return toast('Вопрос ' + (i+1) + ' — минимум 2 варианта', 'error');
            if (!q.answers.some(a => a.correct)) return toast('Вопрос ' + (i+1) + ' — выбери правильный', 'error');
            if (q.answers.some(a => !a.text.trim())) return toast('Вопрос ' + (i+1) + ' — заполни варианты', 'error');
        } else {
            if (q.checkMode !== 'manual' && !q.correctText.trim()) {
                return toast('Вопрос ' + (i+1) + ' — введи правильный ответ или выбери ручную проверку', 'error');
            }
        }
    }

    if (typeof fb === 'undefined') {
        return toast('Firebase не загрузился. Открой файл через http://localhost', 'error');
    }

    try {
        const taskRef = fb.push(fb.ref('teachlexa/tasks'));
        await fb.set(taskRef, {
            title, desc,
            deadline: deadline || null,
            timerMin, mode,
            files: [],
            questions,
            authorName: 'Учитель',
            createdAt: Date.now()
        });
        toast('✅ Задание создано!');
        $('taskTitle').value = '';
        $('taskDesc').value = '';
        $('taskDeadline').value = '';
        $('taskTimer').value = 30;
        questions = [];
        renderQuestions();
    } catch (e) {
        console.error(e);
        toast('Ошибка: ' + (e.message || e), 'error');
    }
});

   ============================================================ */
function renderTeacherTasks(tasks) {
    const list = $('teacherTasksList');
    if (!list) return;
    const all = Object.entries(tasks).map(([id, t]) => ({ ...t, id })).sort((a,b) => b.createdAt - a.createdAt);

    if (all.length === 0) {
        list.innerHTML = '<div class="empty">Заданий пока нет</div>';
        return;
    }

    list.innerHTML = '';
    all.forEach(task => {
        const card = document.createElement('div');
        card.className = 'card';
        const deadlineText = task.deadline
            ? new Date(task.deadline).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit' })
            : 'без дедлайна';
        const modeText = task.mode === 'auto' ? '🤖 Авторабота' : '✍️ Ручная работа';

        card.innerHTML = `
            <div class="card-header">
                <div>
                    <div class="card-title">${escapeHtml(task.title)}</div>
                    <div class="card-meta" style="margin-top:8px;">
                        <span>📅 ${deadlineText}</span>
                        <span>⏱ ${task.timerMin} мин</span>
                        <span>📝 ${task.questions.length} вопросов</span>
                        <span class="badge badge-purple">${modeText}</span>
                    </div>
                </div>
            </div>
            ${task.desc ? `<div class="card-desc">${escapeHtml(task.desc)}</div>` : ''}
            <button class="btn btn-danger btn-small" style="width:auto;margin-top:10px;" data-del="${task.id}">🗑 Удалить</button>
        `;
        card.querySelector('[data-del]').addEventListener('click', async () => {
            if (!confirm('Удалить задание?')) return;
            await fb.remove(fb.ref('teachlexa/tasks/' + task.id));
            toast('Удалено');
        });
        list.appendChild(card);
    });
}

/* ============================================================
   УЧИТЕЛЬ: СПИСОК НА ПРОВЕРКУ
   ============================================================ */
function renderCheckList(submissions) {
    const list = $('checkList');
    if (!list) return;
    const pending = Object.entries(submissions)
        .map(([id, s]) => ({ ...s, id }))
        .filter(s => s.status === 'submitted')
        .sort((a,b) => b.submittedAt - a.submittedAt);

    if (pending.length === 0) {
        list.innerHTML = '<div class="empty">Нет работ на проверку</div>';
        return;
    }

    list.innerHTML = '';
    pending.forEach(sub => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-header">
                <div>
                    <div class="card-title">${escapeHtml(sub.taskTitle)}</div>
                    <div class="card-meta" style="margin-top:8px;">
                        <span>👤 ${escapeHtml(sub.studentName)}</span>
                        <span>📅 ${new Date(sub.submittedAt).toLocaleString('ru-RU')}</span>
                    </div>
                </div>
                <span class="badge badge-yellow">На проверке</span>
            </div>
            <button class="btn btn-primary btn-small" style="width:auto;margin-top:10px;" data-check="${sub.id}">✅ Проверить</button>
        `;
        card.querySelector('[data-check]').addEventListener('click', async () => {
            const taskSnap = await fb.get(fb.ref('teachlexa/tasks/' + sub.taskId));
            const task = taskSnap.val();
            if (!task) return toast('Задание удалено', 'error');
            openCheckModal(sub, task);
        });
        list.appendChild(card);
    });
}

function openCheckModal(sub, task) {
    const content = $('checkModalContent');
    const manualResults = sub.manualChecks || {};

    let html = `<div style="margin-bottom:14px;">
        <div style="color:#fff;font-size:16px;font-weight:800;">${escapeHtml(task.title)}</div>
        <div style="color:#8899bb;font-size:13px;">Ученик: <b style="color:#44ff88;">${escapeHtml(sub.studentName)}</b></div>
    </div>`;

    task.questions.forEach((q, i) => {
        const ans = sub.answers[i];
        const qCheckMode = q.type === 'text' ? (q.checkMode || 'auto') : 'auto';

        html += `<div class="question-block">
            <div style="color:#88ddff;font-size:13px;font-weight:800;margin-bottom:8px;">Вопрос ${i+1}: ${escapeHtml(q.text)}</div>`;

        if (q.type === 'choice') {
            const correctText = q.answers.find(a => a.correct)?.text || '';
            html += `<div style="font-size:13px;color:#8899bb;">Ответ ученика: <b style="color:#fff;">${escapeHtml(ans?.text || '(нет)')}</b></div>
                <div style="font-size:13px;color:#8899bb;">Правильный: <b style="color:#44ff88;">${escapeHtml(correctText)}</b></div>`;
        } else {
            html += `<div style="font-size:13px;color:#8899bb;">Ответ ученика:</div>
                <div style="background:rgba(0,0,0,0.4);padding:12px;border-radius:10px;margin-top:6px;color:#fff;font-size:14px;">${escapeHtml(ans?.text || '(нет ответа)')}</div>`;

            if (qCheckMode === 'manual') {
                const currentCheck = manualResults[i];
                html += `<div class="manual-check-row" data-qindex="${i}">
                    <span class="check-label">Ручная проверка:</span>
                    <button class="check-btn check-yes ${currentCheck === true ? 'active' : ''}" data-check-q="${i}" data-check-val="true">✓</button>
                    <button class="check-btn check-no ${currentCheck === false ? 'active' : ''}" data-check-q="${i}" data-check-val="false">✕</button>
                    <span class="check-status-badge ${currentCheck === true ? 'ok' : currentCheck === false ? 'fail' : ''}" data-status-badge="${i}">
                        ${currentCheck === true ? '✅ Верно' : currentCheck === false ? '❌ Неверно' : '⏳ Ожидает'}
                    </span>
                </div>`;
            } else {
                html += `<div style="font-size:13px;color:#8899bb;margin-top:8px;">Правильный: <b style="color:#44ff88;">${escapeHtml(q.correctText)}</b></div>`;
            }
        }
        html += `</div>`;
    });

    html += `<div style="margin-top:24px;">
        <label style="color:#8899bb;font-size:11px;letter-spacing:2px;font-weight:800;">ИТОГОВАЯ ОЦЕНКА</label>
        <div style="display:flex;gap:10px;margin-top:10px;">
            <button class="btn grade-5" style="width:60px;height:60px;font-size:24px;border-radius:14px;padding:0;" data-grade="5">5</button>
            <button class="btn grade-4" style="width:60px;height:60px;font-size:24px;border-radius:14px;padding:0;" data-grade="4">4</button>
            <button class="btn grade-3" style="width:60px;height:60px;font-size:24px;border-radius:14px;padding:0;" data-grade="3">3</button>
            <button class="btn grade-2" style="width:60px;height:60px;font-size:24px;border-radius:14px;padding:0;" data-grade="2">2</button>
        </div>
    </div>`;

    content.innerHTML = html;

    content.querySelectorAll('[data-check-q]').forEach(btn => {
        btn.addEventListener('click', () => {
            const qi = parseInt(btn.dataset.checkQ);
            const val = btn.dataset.checkVal === 'true';
            manualResults[qi] = val;
            const row = content.querySelector(`.manual-check-row[data-qindex="${qi}"]`);
            row.querySelectorAll('.check-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const badge = row.querySelector(`[data-status-badge="${qi}"]`);
            badge.className = 'check-status-badge ' + (val ? 'ok' : 'fail');
            badge.textContent = val ? '✅ Верно' : '❌ Неверно';
        });
    });

    content.querySelectorAll('[data-grade]').forEach(btn => {
        btn.addEventListener('click', () => {
            setGrade(sub.id, parseInt(btn.dataset.grade), manualResults);
        });
    });

    openModal('checkModal');
}

async function setGrade(subId, grade, manualResults) {
    try {
        const updateData = { grade, status: 'graded', gradedAt: Date.now() };
        if (manualResults && Object.keys(manualResults).length > 0) {
            updateData.manualChecks = manualResults;
        }
        await fb.update(fb.ref('teachlexa/submissions/' + subId), updateData);
        toast('✅ Оценка ' + grade + ' выставлена!');
        closeModal('checkModal');
    } catch (e) {
        console.error(e);
        toast('Ошибка', 'error');
    }
}

/* ============================================================
   УЧЕНИК: СПИСОК ЗАДАНИЙ
   ============================================================ */
function renderTasks(tasksArg) {
    const list = $('tasksList');
    if (!list || !currentUser) return;

    const tasks = tasksArg || {};
    const all = Object.entries(tasks).map(([id, t]) => ({ ...t, id })).sort((a,b) => b.createdAt - a.createdAt);

    if (all.length === 0) {
        list.innerHTML = '<div class="empty">Заданий пока нет</div>';
        return;
    }

    fb.get(fb.ref('teachlexa/submissions')).then(subSnap => {
        const subs = subSnap.val() || {};
        const mySubs = {};
        Object.entries(subs).forEach(([id, s]) => {
            if (s.studentKey === currentUserKey) mySubs[s.taskId] = { ...s, id };
        });

        list.innerHTML = '';
        all.forEach(task => {
            const sub = mySubs[task.id];
            const card = document.createElement('div');
            card.className = 'card';

            let statusBadge = '';
            let actionBtn = '';

            if (!sub) {
                statusBadge = '<span class="badge badge-blue">Новое</span>';
                actionBtn = `<button class="btn btn-primary btn-small" style="width:auto;margin-top:10px;" data-start="${task.id}">🚀 Начать выполнение</button>`;
            } else if (sub.status === 'submitted') {
                statusBadge = '<span class="badge badge-yellow">На проверке</span>';
                actionBtn = `<div style="color:#88bb99;font-size:13px;margin-top:10px;">Работа отправлена на проверку</div>`;
            } else if (sub.status === 'graded') {
                statusBadge = '<span class="badge badge-green">Проверено</span>';
                actionBtn = `<div style="display:flex;align-items:center;gap:12px;margin-top:10px;">
                    <div class="grade grade-${sub.grade}">${sub.grade}</div>
                    <div style="color:#88bb99;font-size:13px;">Оценка получена</div>
                </div>`;
            }

            const deadlineText = task.deadline
                ? new Date(task.deadline).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit' })
                : 'без дедлайна';

            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="card-title">${escapeHtml(task.title)}</div>
                        <div class="card-meta" style="margin-top:8px;">
                            <span>📅 ${deadlineText}</span>
                            <span>⏱ ${task.timerMin} мин</span>
                            <span>📝 ${task.questions.length} вопросов</span>
                        </div>
                    </div>
                    ${statusBadge}
                </div>
                ${task.desc ? `<div class="card-desc">${escapeHtml(task.desc)}</div>` : ''}
                ${actionBtn}
            `;

            const startBtn = card.querySelector('[data-start]');
            if (startBtn) startBtn.addEventListener('click', () => startTask(task));

            list.appendChild(card);
        });
    });
}

function startTask(task) {
    $('workModalTitle').textContent = task.title;
    const content = $('workModalContent');
    const answers = task.questions.map(() => ({ text: '' }));

    let html = `${task.desc ? `<div class="card-desc" style="margin-bottom:16px;">${escapeHtml(task.desc)}</div>` : ''}`;
    task.questions.forEach((q, i) => {
        html += `<div class="question-block">
            <div class="q-num">Вопрос ${i+1}</div>
            <div style="color:#fff;font-size:15px;font-weight:800;margin:8px 0 14px;">${escapeHtml(q.text)}</div>`;

        if (q.type === 'choice') {
            q.answers.forEach((a, ai) => {
                html += `<label class="answer-pick" data-q="${i}" data-a="${ai}">
                    <input type="radio" name="q${i}" value="${ai}" data-q="${i}" data-a="${ai}" class="answer-radio">
                    <span class="ans-text">${escapeHtml(a.text)}</span>
                </label>`;
            });
        } else {
            html += `<textarea class="answer-textarea" data-q="${i}" placeholder="Напиши ответ..." style="width:100%;padding:14px 18px;background:rgba(0,0,0,0.5);border:2px solid #2a3a5a;border-radius:12px;color:#fff;font-size:15px;font-family:inherit;font-weight:600;outline:none;min-height:100px;resize:vertical;"></textarea>`;
        }
        html += `</div>`;
    });
    html += `<button class="btn btn-primary" id="submitWorkBtn" style="margin-top:16px;">📤 ОТПРАВИТЬ РАБОТУ</button>`;

    content.innerHTML = html;

    content.querySelectorAll('.answer-radio').forEach(r => r.addEventListener('change', () => {
        const qi = parseInt(r.dataset.q);
        content.querySelectorAll(`.answer-pick[data-q="${qi}"]`).forEach(row => row.classList.remove('selected'));
        r.closest('.answer-pick').classList.add('selected');
        const q = task.questions[qi];
        answers[qi].text = q.answers[parseInt(r.dataset.a)].text;
    }));

    content.querySelectorAll('.answer-textarea').forEach(ta => ta.addEventListener('input', () => {
        answers[parseInt(ta.dataset.q)].text = ta.value;
    }));

    $('submitWorkBtn').addEventListener('click', () => submitWork(task, answers));

    if (activeTimer) clearInterval(activeTimer);
    let secondsLeft = task.timerMin * 60;
    const timerEl = $('timerDisplay');
    timerEl.style.display = 'block';
    const updateTimer = () => {
        const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const s = String(secondsLeft % 60).padStart(2, '0');
        timerEl.textContent = '⏱ ' + m + ':' + s;
        if (secondsLeft <= 0) {
            clearInterval(activeTimer);
            timerEl.style.display = 'none';
            toast('Время вышло! Работа отправлена.', 'error');
            submitWork(task, answers);
        }
        secondsLeft--;
    };
    updateTimer();
    activeTimer = setInterval(updateTimer, 1000);

    openModal('workModal');
}

async function submitWork(task, answers) {
    if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
    $('timerDisplay').style.display = 'none';

    try {
        let autoGrade = null;
        if (task.mode === 'auto') {
            let correct = 0;
            task.questions.forEach((q, i) => {
                const ans = answers[i].text;
                if (q.type === 'choice') {
                    const correctAns = q.answers.find(a => a.correct)?.text;
                    if (correctAns && ans === correctAns) correct++;
                } else {
                    if (q.checkMode !== 'manual' && q.correctText.trim().toLowerCase() === ans.trim().toLowerCase()) correct++;
                }
            });
            const pct = correct / task.questions.length;
            if (pct >= 0.85) autoGrade = 5;
            else if (pct >= 0.65) autoGrade = 4;
            else if (pct >= 0.45) autoGrade = 3;
            else autoGrade = 2;
        }

        const subRef = fb.push(fb.ref('teachlexa/submissions'));
        const subData = {
            taskId: task.id,
            taskTitle: task.title,
            studentKey: currentUserKey,
            studentName: currentUser.name,
            answers,
            submittedAt: Date.now(),
            status: autoGrade ? 'graded' : 'submitted'
        };
        if (autoGrade) {
            subData.grade = autoGrade;
            subData.gradedAt = Date.now();
        }
        await fb.set(subRef, subData);

        closeModal('workModal');
        toast(autoGrade ? '✅ Работа отправлена! Оценка: ' + autoGrade : '✅ Работа отправлена на проверку!');
    } catch (e) {
        console.error(e);
        toast('Ошибка: ' + (e.message || e), 'error');
    }
}

/* ============================================================
   УЧЕНИК: МОИ ОЦЕНКИ
   ============================================================ */
function renderResults(submissions) {
    const list = $('resultsList');
    if (!list || !currentUser) return;

    const subs = submissions || {};
    const mySubs = Object.entries(subs)
        .map(([id, s]) => ({ ...s, id }))
        .filter(s => s.studentKey === currentUserKey)
        .sort((a,b) => b.submittedAt - a.submittedAt);

    if (mySubs.length === 0) {
        list.innerHTML = '<div class="empty">Ты ещё не сдал ни одной работы</div>';
        return;
    }

    const graded = mySubs.filter(s => s.grade);
    const avg = graded.length > 0 ? (graded.reduce((sum, s) => sum + s.grade, 0) / graded.length) : 0;
    const avgFormatted = graded.length > 0 ? (avg % 1 === 0 ? avg.toString() : avg.toFixed(2)) : '—';

    let html = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;">
        <div class="card" style="text-align:center;margin:0;">
            <div style="font-size:36px;font-weight:900;color:#ffdd44;">${avgFormatted}</div>
            <div style="color:#8899bb;font-size:11px;letter-spacing:2px;">СРЕДНИЙ БАЛЛ</div>
        </div>
        <div class="card" style="text-align:center;margin:0;">
            <div style="font-size:36px;font-weight:900;color:#44ff88;">${graded.length}</div>
            <div style="color:#8899bb;font-size:11px;letter-spacing:2px;">ОЦЕНОК</div>
        </div>
    </div>`;

    mySubs.forEach(sub => {
        const gradeHtml = sub.grade
            ? `<div class="grade grade-${sub.grade}">${sub.grade}</div>`
            : `<span class="badge badge-yellow">На проверке</span>`;
        html += `<div class="card">
            <div class="card-header" style="margin:0;">
                <div>
                    <div class="card-title" style="font-size:16px;">${escapeHtml(sub.taskTitle)}</div>
                    <div class="card-meta" style="margin-top:6px;">
                        <span>📅 ${new Date(sub.submittedAt).toLocaleString('ru-RU')}</span>
                    </div>
                </div>
                ${gradeHtml}
            </div>
        </div>`;
    });

    list.innerHTML = html;
}
</script>
