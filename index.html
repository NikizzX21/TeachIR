        workFinished = true;
        showFinishScreen(autoGrade);
    } catch (e) {
        console.error(e);
        toast('Ошибка: ' + (e.message || e), 'error');
    }
}

function showFinishScreen(autoGrade) {
    $('closeWorkModalBtn').style.display = 'none';
    const content = $('workModalContent');
    const isExam = CATEGORIES[currentTask.category || 'dz'].isExam;

    let resultBlock = '';
    if (autoGrade) {
        if (isExam) {
            resultBlock = `<div style="margin:20px 0;color:#4a9eff;font-size:18px;font-weight:800;">Работа проверена автоматически</div>`;
        } else {
            resultBlock = `<div style="margin:20px 0;display:flex;align-items:center;justify-content:center;gap:16px;">
                <div class="grade grade-${autoGrade}" style="width:80px;height:80px;font-size:36px;">${autoGrade}</div>
                <div style="color:#88bb99;font-size:16px;">Твоя оценка</div>
            </div>`;
        }
    }

    content.innerHTML = `
        <div class="finish-screen">
            <div class="finish-icon">✅</div>
            <h2>Работа отправлена!</h2>
            <p>Учитель скоро проверит её и выставит оценку. Ты можешь увидеть результат в разделе «🏆 Оценки».</p>
            ${resultBlock}
            <div class="finish-actions">
                <button class="btn btn-primary" id="backToListBtn" style="margin:0;">← Вернуться к заданиям</button>
            </div>
        </div>
    `;

    $('backToListBtn').addEventListener('click', () => {
        closeModal('workModal');
        // Не даём открыть заново — просто вернёмся к категории, где было задание
        const catTabMap = { vpr: 's_vpr', kr: 's_kr', dz: 's_dz', oge: 's_oge', ege: 's_ege' };
        switchTab(catTabMap[currentTask.category || 'dz'] || 's_dz');
    });
}

/* ====== УЧЕНИК: МОИ ОЦЕНКИ ====== */
function renderResults(submissions) {
    const list = $('resultsList');
    if (!list || !currentUser) return;

    const mySubs = Object.entries(submissions)
        .map(([id, s]) => ({ ...s, id }))
        .filter(s => s.studentKey === currentUserKey)
        .sort((a,b) => (b.submittedAt||0) - (a.submittedAt||0));

    if (mySubs.length === 0) { list.innerHTML = '<div class="empty">Ты ещё не сдал ни одной работы</div>'; return; }

    const graded = mySubs.filter(s => s.status === 'graded');
    let totalSum = 0, countSum = 0;
    graded.forEach(s => {
        if (s.grade) { totalSum += s.grade; countSum++; }
        else if (s.score != null && s.maxScore) { totalSum += (s.score / s.maxScore) * 5; countSum++; }
    });
    const avg = countSum > 0 ? (totalSum / countSum) : 0;
    const avgFormatted = countSum > 0 ? (avg % 1 === 0 ? avg.toString() : avg.toFixed(2)) : '—';

    let html = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;">
        <div class="card" style="text-align:center;margin:0;">
            <div style="font-size:42px;font-weight:900;color:#ffdd44;">${avgFormatted}</div>
            <div style="color:#8899bb;font-size:11px;letter-spacing:2px;">СРЕДНИЙ БАЛЛ</div>
        </div>
        <div class="card" style="text-align:center;margin:0;">
            <div style="font-size:42px;font-weight:900;color:#44ff88;">${graded.length}</div>
            <div style="color:#8899bb;font-size:11px;letter-spacing:2px;">ОЦЕНОК</div>
        </div>
    </div>`;

    mySubs.forEach(sub => {
        const isExam = CATEGORIES[sub.category || 'dz'].isExam;
        let resultHtml;
        if (sub.status === 'graded') {
            if (isExam && sub.score != null) resultHtml = `<div class="score-display">${sub.score} / ${sub.maxScore}</div>`;
            else resultHtml = `<div class="grade grade-${sub.grade}">${sub.grade}</div>`;
        } else {
            resultHtml = `<span class="badge badge-yellow">На проверке</span>`;
        }
        html += `<div class="card">
            <div class="card-header" style="margin:0;">
                <div>
                    <div class="card-title" style="font-size:16px;">${escapeHtml(sub.taskTitle)}</div>
                    <div class="card-meta" style="margin-top:8px;">
                        <span class="badge badge-purple">${CATEGORIES[sub.category || 'dz'].name}</span>
                        <span>📅 ${new Date(sub.submittedAt).toLocaleString('ru-RU')}</span>
                    </div>
                </div>
                ${resultHtml}
            </div>
        </div>`;
    });

    list.innerHTML = html;
}

/* ====== АВТОПОДГОНКА ====== */
document.addEventListener('input', (e) => {
    if (e.target.tagName === 'TEXTAREA' && e.target.id !== 'studentPassword' && e.target.id !== 'teacherPassword') {
        autoResize(e.target);
    }
});
window.addEventListener('load', () => {
    document.querySelectorAll('textarea').forEach(autoResize);
});

/* Блокируем закрытие модалки прохождения по фону, если работа не завершена */
$('workModal').addEventListener('click', (e) => {
    if (e.target === $('workModal')) {
        // клик по фону — ничего не делаем
    }
});
$('closeWorkModalBtn').addEventListener('click', () => {
    if (workFinished) {
        closeModal('workModal');
    } else {
        if (confirm('Выйти без отправки? Ответы не сохранятся.')) {
            if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
            $('timerDisplay').classList.remove('active');
            closeModal('workModal');
        }
    }
});
